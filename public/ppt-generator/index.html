<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>WAC AiPPT</title>
  <script src="static/docmee-ui-sdk-iframe.min.js"></script>
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
    }

    .page_navigate {
      padding: 5px;
      height: 45px;
      width: calc(100% - 50px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page_navigate>div {
      padding: 8px 16px;
      margin-right: 8px;
      cursor: pointer;
      user-select: none;
      border: 2px solid #f0f0f0;
      border-radius: 6px;
    }

    .page_navigate .selected {
      background: #f57bb0;
    }

    #container {
      width: calc(100% - 50px);
      height: calc(100% - 100px);
      margin: 0 auto;
      padding: 0;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(120, 120, 120, 0.3);
      overflow: hidden;
      background: linear-gradient(-157deg, #f57bb0, #867dea);
      color: white;
    }
  </style>
</head>

<body>
  <!-- 示例二 -->
  <div style="text-align: center;padding: 5px;font-size: 24px">
    <span>请按需使用&nbsp;</span>
  </div>
  <!-- 挂载iframe容器 -->
  <div id="container"></div>
</body>

<!-- 先获取配置，再初始化应用 -->
<script>
  // 获取配置
  fetch('/api/ppt/config')
    .then(res => {
      if (!res.ok) {
        throw new Error('Failed to fetch config');
      }
      return res.json();
    })
    .then(config => {
      if (!config.apiKey) {
        throw new Error('API Key not found in config');
      }
      window.ENV_DOCMEE_API_KEY = config.apiKey;
      initApp();
    })
    .catch(error => {
      console.error('Error fetching config:', error);
      alert('配置加载失败，请检查环境变量设置');
    });

  function initApp() {
    if (location.protocol == 'file:') {
      alert('不支持 file 协议直接访问，请启动 http 服务访问！\n\n启动命令：npm run start')
    }

    const apiKey = window.ENV_DOCMEE_API_KEY;

    if (!apiKey) {
      console.error('未配置 DOCMEE_API_KEY 环境变量')
      alert('请配置 DOCMEE API KEY')
      return;
    }

    // 修改createApiToken函数
    async function createApiToken(apiKey, uid, limit) {
      try {
        const response = await fetch('/api/ppt/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ uid, limit })
        });

        const data = await response.json();
        if (data.code !== 0) {
          alert('创建token异常：' + data.message);
          return null;
        }
        return data.data.token;
      } catch (error) {
        alert('网络异常: ' + error.message);
        return null;
      }
    }

    // 修改初始化部分，因为createApiToken现在是异步的
    async function initDocmeeUI() {
      var uid = 'xxx'
      var limit = null
      var token = await createApiToken(apiKey, uid, limit)

      if (!token) {
        console.error('Failed to create token');
        return;
      }

      const docmeeUI = new DocmeeUI({
        pptId: null,
        token: token,
        container: document.querySelector('#container'),
        page: 'creator',
        lang: 'zh',
        mode: 'light',
        isMobile: false,
        background: 'linear-gradient(-157deg,#f57bb0, #867dea)',
        padding: '40px 20px 0px',
        onMessage(message) {
          console.log(message)
          if (message.type === 'invalid-token') {
            // 在token失效时触发
            console.log('token 认证错误')
            // 更换新的 token
            let newToken = createApiToken(apiKey, uid, limit)
            docmeeUI.updateToken(newToken)
          } else if (message.type === 'beforeGenerate') {
            const { subtype, fields } = message.data
            if (subtype === 'outline') {
              // 生成大纲前触发
              console.log('即将生成ppt大纲', fields)
              return true
            } else if (subtype === 'ppt') {
              // 生成PPT前触发
              console.log('即将生成ppt', fields)
              docmeeUI.sendMessage({
                type: 'success',
                content: '继续生成PPT',
              })
              return true
            }
          } else if (message.type === 'beforeCreateCustomTemplate') {
            const { file, totalPptCount } = message.data
            // 是否允许用户继续制作PPT
            console.log('用户自定义完整模版，PPT文件：', file.name)
            if (totalPptCount < 2) {
              console.log('用户生成积分不足，不允许制作自定义完整模版')
              return false
            }
            return true
          } else if (message.type == 'pageChange') {
            pageChange(message.data.page)
          } else if (message.type === 'beforeDownload') {
            // 自定义下载PPT的文件名称
            const { id, subject } = message.data
            return `PPT_${subject}.pptx`
          } else if (message.type == 'error') {
            if (message.data.code == 88) {
              // 创建token传了limit参数可以限制使用次数
              alert('您的次数已用完')
            } else {
              alert('发生错误：' + message.data.message)
            }
          }
        }
      })

      function toPage(page) {
        docmeeUI.navigate({ page })
        pageChange(page)
      }

      function pageChange(page) {
        let element = document.getElementById('page_' + page)
        if (element) {
          element.parentNode.childNodes.forEach(c => c.classList && c.classList.remove('selected'))
          element.classList.add('selected')
        }
      }

      // 每500ms检查一次注入自定义CSS
      // setInterval(() => {
      //   injectCustomCSS()
      // }, 500)

      function injectCustomCSS() {
        const customCSS = `
          /* 隐藏"我的作品"按钮 - 使用多个选择器确保隐藏 */
          .hdd-btn.hdd-btn-link.hdd-btn-color-primary.hdd-btn-variant-link.hdd-btn-sm { 
            display: none !important; 
          }
          button[class*="hdd-btn"]:has(span:contains("我的作品")) {
            display: none !important;
          }
          .flex.items-center.gap-1:has(span:contains("我的作品")) {
            display: none !important;
          }
          /* 备用选择器 */
          button:has(> svg[viewBox="0 0 24 24"] + span:contains("我的作品")) {
            display: none !important;
          }

          /* 隐藏主页按钮 */
          .hdd-btn.hdd-btn-default.hdd-btn-color-default.hdd-btn-variant-outlined.hdd-btn-sm.btn-ghost,
          button.btn-square:has(svg[viewBox="0 0 1024 1024"]),
          .btn.btn-sm.btn-ghost.bg-base-100\\/50:has(svg[viewBox="0 0 1024 1024"]) {
            display: none !important;
          }

          /* 隐藏"试一试"区域 */
          .hdd-divider-with-text,
          .hdd-divider-with-text-center,
          .flex.items-center.gap-2:has(.flex.flex-wrap.items-center.justify-center),
          div:has(> svg[viewBox="0 0 16 16"]) + div.flex.items-center.gap-2,
          .flex.flex-wrap.items-center.justify-center.gap-2 {
            display: none !important;
          }

          /* 隐藏特定元素 */
          .header-logo { display: none !important; }
          .footer-container { display: none !important; }
          
          /* 调整模板大小 */
          .box-border {
            width: 100% !important;  /* 增加宽度 */
            max-width: none !important;
            max-height: 130% !important;
          }
            
          /* 调整图片容器大小 */
          .relative.w-full.overflow-hidden.rounded-md.aspect-video {
            width: 42% !important;
            height: 100% !important;
          }
          
          /* 调整图片大小 */
          .hdd-image-img {
            width: auto !important;
            height: auto !important;
          }

          /* 隐藏ID和创建时间 */
          .hdd-typography.hdd-typography-ellipsis.hdd-typography-ellipsis-single-line,
          .text-xs.text-ellipsis.overflow-hidden.whitespace-nowrap {
            display: none !important;
          }
          
          /* 隐藏推荐主题区域 */
          .hdd-divider-with-text,
          .flex.flex-wrap.items-center.justify-center.gap-2 {
            display: none !important;
          }
          
          /* 隐藏"创建新模版"组件 */
          .flex.items-center.gap-5.my-5.animate-fade { display: none !important; }
          
          /* 其他原有的CSS保持不变 */
          div[class*="animate-fade"] div[class*="border-accent"] { display: none !important; }
          div:has(.uppercase:contains("创建新模版")) { display: none !important; }
          .template-list-container div:has(svg + div.uppercase:contains("创建新模版")) { 
            display: none !important; 
          }
          svg.text-error.btn-outline { display: none !important; }
          .btn-sm.btn-outline svg[viewBox="0 0 24 24"] { display: none !important; }
          svg[stroke-linecap="round"][stroke-linejoin="round"].text-error { display: none !important; }
          button:has(svg.text-error), a:has(svg.text-error) { display: none !important; }
          div[data-tip="更改源文件"] { display: none !important; }
          div[title="更改源文件"] { display: none !important; }
          div:has(> svg > path[d^="M19.903 8.586"]) { display: none !important; }
          .data-tip:has(svg[viewBox="0 0 24 24"]:not([viewBox="0 0 512 512"])) { display: none !important; }
        `;
        docmeeUI.importCSS(customCSS);
      }
    }

    // 初始化DocmeeUI
    initDocmeeUI();
  }
</script>

</html>
