<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>WAC AI PPT</title>
  <!-- 添加 favicon -->
  <link rel="icon" type="image/svg+xml" href="/WAC-LOGO.svg" />
  <script src="static/docmee-ui-sdk-iframe.min.js"></script>
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
    }

    .page_navigate {
      padding: 5px;
      height: 45px;
      width: calc(100% - 50px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page_navigate>div {
      padding: 8px 16px;
      margin-right: 8px;
      cursor: pointer;
      user-select: none;
      border: 2px solid #f0f0f0;
      border-radius: 6px;
    }

    .page_navigate .selected {
      background: #f57bb0;
    }

    #container {
      width: calc(100% - 50px);
      height: calc(100% - 100px);
      margin: 0 auto;
      padding: 0;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(120, 120, 120, 0.3);
      overflow: hidden;
      background: linear-gradient(-157deg, #f57bb0, #867dea);
      color: white;
    }

    /* 隐藏特定组件的CSS */
    /* 例如隐藏顶部的某些按钮 */
    iframe {
      /* 这会在iframe加载后应用样式 */
    }

    /* 使用importCSS方法注入样式到iframe内部 */
  </style>
</head>

<body>
  <div style="text-align: center;padding: 5px;font-size: 24px">
    <span>请按需使用&nbsp;</span>
  </div>
  <!-- 自定义导航按钮 -->
  <!-- <div class="page_navigate"> -->
  <!-- <div id="page_creator" class="selected" onclick="toPage('creator')">生成PPT</div>
    <div id="page_dashboard" onclick="toPage('dashboard')">PPT列表</div>
    <div id="page_customTemplate" onclick="toPage('customTemplate')">自定义模板</div> -->
  <!-- </div> -->
  <!-- 挂载iframe容器 -->
  <div id="container"></div>
</body>
<script>
  class PPTGenerator {
    constructor() {
      this.docmeeUI = null
      this.checkInterval = null
      this.isRefreshing = false
      this.refreshAttempts = 0
      this.maxRefreshAttempts = 3
      this.lastRefreshTime = 0  // 添加最后刷新时间记录
      this.init()
    }

    async init() {
      try {
        // 清理之前的实例
        this.destroy();

        // 添加重试机制
        let retryCount = 0;
        const maxRetries = 3;

        while (retryCount < maxRetries) {
          try {
            // 从服务端获取token
            const response = await fetch('/api/ppt/token', {
              cache: 'no-cache',
              headers: {
                'Cache-Control': 'no-cache',
                'Pragma': 'no-cache'
              },
              credentials: 'include' // 添加凭证
            });

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            if (!data.token) {
              throw new Error('Failed to get token');
            }

            // 重置计数器
            this.refreshAttempts = 0;
            this.lastRefreshTime = 0;

            this.initUI(data.token);
            return; // 成功后退出

          } catch (err) {
            console.error(`Init attempt ${retryCount + 1} failed:`, err);
            retryCount++;

            if (retryCount === maxRetries) {
              throw err;
            }

            // 等待时间随重试次数增加
            await new Promise(resolve => setTimeout(resolve, 2000 * retryCount));
          }
        }
      } catch (error) {
        console.error('PPT Generator init failed after retries:', error);
        // 显示错误提示，但不自动重试
        alert('初始化失败，请刷新页面重试。如果问题持续存在，请检查网络连接或联系管理员。');
      }
    }

    async refreshToken() {
      try {
        if (this.isRefreshing || this.refreshAttempts >= this.maxRefreshAttempts) {
          console.log('Token refresh skipped');
          return false;
        }

        this.isRefreshing = true;
        this.refreshAttempts++;

        const response = await fetch('/api/ppt/token/refresh', {
          cache: 'no-cache',
          headers: {
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          },
          credentials: 'include' // 添加凭证
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        if (!data.token) {
          throw new Error('Failed to refresh token');
        }

        // 更新 token
        this.docmeeUI.updateToken(data.token);

        // 重置计数器
        this.refreshAttempts = 0;
        console.log('Token refreshed successfully');
        return true;

      } catch (error) {
        console.error('Token refresh failed:', error);
        // 不要自动重试，而是提示用户
        alert('登录已过期，请刷新页面重新登录');
        this.destroy();
        return false;
      } finally {
        this.isRefreshing = false;
      }
    }

    initUI(token) {
      // 如果已经存在实例，先销毁
      if (this.docmeeUI) {
        try {
          this.docmeeUI.destroy()
        } catch (e) {
          console.warn('Failed to destroy previous instance:', e)
        }
      }

      this.docmeeUI = new DocmeeUI({
        token,
        container: document.querySelector('#container'),
        page: 'creator',
        lang: 'zh',
        mode: 'light',
        isMobile: false,
        background: 'linear-gradient(-157deg,#f57bb0, #867dea)',
        padding: '40px 20px 0px',
        onMessage: this.handleMessage.bind(this)
      })

      // 检查 iframe 是否加载完成
      const checkIframeLoaded = () => {
        const iframe = this.docmeeUI.iframe
        if (!iframe) {
          setTimeout(checkIframeLoaded, 100)
          return
        }

        iframe.onload = () => {
          console.log('iframe loaded')
          // iframe 加载完成后再注入 CSS
          this.injectCustomCSS()
          // 开始定期检查
          this.startPeriodicCheck()
        }
      }

      checkIframeLoaded()
    }

    startPeriodicCheck() {
      // 清除可能存在的旧定时器
      if (this.checkInterval) {
        clearInterval(this.checkInterval)
      }

      // 每500ms检查一次
      this.checkInterval = setInterval(() => {
        this.injectCustomCSS()
      }, 500)
    }

    injectCustomCSS() {
      const customCSS = `
        /* 隐藏"我的作品"按钮 - 使用多个选择器确保隐藏 */
        .hdd-btn.hdd-btn-link.hdd-btn-color-primary.hdd-btn-variant-link.hdd-btn-sm { 
          display: none !important; 
        }
        button[class*="hdd-btn"]:has(span:contains("我的作品")) {
          display: none !important;
        }
        .flex.items-center.gap-1:has(span:contains("我的作品")) {
          display: none !important;
        }
        /* 备用选择器 */
        button:has(> svg[viewBox="0 0 24 24"] + span:contains("我的作品")) {
          display: none !important;
        }

        /* 隐藏主页按钮 */
        .hdd-btn.hdd-btn-default.hdd-btn-color-default.hdd-btn-variant-outlined.hdd-btn-sm.btn-ghost,
        button.btn-square:has(svg[viewBox="0 0 1024 1024"]),
        .btn.btn-sm.btn-ghost.bg-base-100\\/50:has(svg[viewBox="0 0 1024 1024"]) {
          display: none !important;
        }

        /* 隐藏"试一试"区域 */
        .hdd-divider-with-text,
        .hdd-divider-with-text-center,
        .flex.items-center.gap-2:has(.flex.flex-wrap.items-center.justify-center),
        div:has(> svg[viewBox="0 0 16 16"]) + div.flex.items-center.gap-2,
        .flex.flex-wrap.items-center.justify-center.gap-2 {
          display: none !important;
        }
      `;
      this.docmeeUI.importCSS(customCSS);
    }

    async handleMessage(message) {
      console.log('收到消息:', message)
      try {
        switch (message.type) {
          case 'invalid-token':
            // 改进token刷新逻辑
            if (Date.now() - (this.lastRefreshTime || 0) < 5000) {
              console.log('刷新太频繁，等待...');
              return new Promise(resolve => setTimeout(resolve, 5000))
                .then(() => this.refreshToken());
            }
            this.lastRefreshTime = Date.now();

            if (this.refreshAttempts < this.maxRefreshAttempts) {
              console.log('Token invalid, attempting to refresh...');
              return this.refreshToken()
                .catch(err => {
                  console.error('Token refresh failed:', err);
                  // 如果刷新失败，尝试完全重新初始化
                  this.destroy();
                  return this.init();
                });
            }
            break

          case 'mounted':
            // 处理mounted事件，发送用户信息
            try {
              await this.docmeeUI.sendMessage({
                type: 'update-user-info',
                data: {
                  userId: 'user123',
                  username: 'WAC User',
                  role: 'user',
                  permissions: ['create', 'edit', 'download']
                }
              })
            } catch (e) {
              console.warn('Failed to update user info:', e)
            }
            break

          case 'beforeGenerate':
            return this.handleBeforeGenerate(message.data)
          case 'beforeCreateCustomTemplate':
            return this.handleBeforeCreateCustomTemplate(message.data)
          case 'pageChange':
            pageChange(message.data.page)
            break
          case 'beforeDownload':
            return this.handleBeforeDownload(message.data)
          case 'error':
            this.handleError(message.data)
            break
          case 'user-info':
            console.log('用户信息:', message.data)
            break
          case 'getCurrentPptInfo':
            console.log('当前PPT信息:', message.data)
            break
        }
      } catch (error) {
        console.error('Message handling failed:', error)
        if (message.type === 'invalid-token' && this.refreshAttempts >= this.maxRefreshAttempts) {
          this.destroy()
          // 添加延迟重试
          setTimeout(() => {
            console.log('Attempting to reinitialize...');
            this.init();
          }, 3000);
        }
      }
    }

    handleBeforeGenerate(data) {
      const { subtype, fields } = data
      if (subtype === 'outline') {
        // 生成大纲前触发
        console.log('即将生成ppt大纲', fields)
        // 检查 token 是否有效
        this.checkAndRefreshToken()
        return true
      } else if (subtype === 'ppt') {
        // 生成PPT前触发
        console.log('即将生成ppt', fields)
        // 检查 token 是否有效
        this.checkAndRefreshToken()
        this.docmeeUI.sendMessage({
          type: 'success',
          content: '继续生成PPT',
        })
        return true
      }
      return true
    }

    async checkAndRefreshToken() {
      try {
        // 添加重试机制
        let retryCount = 0;
        const maxRetries = 3;

        while (retryCount < maxRetries) {
          try {
            const response = await fetch('/api/ppt/token', {
              // 添加no-cache确保获取新token
              cache: 'no-cache',
              headers: {
                'Cache-Control': 'no-cache'
              }
            });

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            if (!data.token) {
              throw new Error('No token received');
            }

            // 更新 token
            this.docmeeUI.updateToken(data.token);
            console.log('Token updated successfully');
            return true;

          } catch (err) {
            retryCount++;
            if (retryCount === maxRetries) {
              throw err;
            }
            // 等待一段时间后重试
            await new Promise(resolve => setTimeout(resolve, 1000 * retryCount));
          }
        }
      } catch (error) {
        console.error('Token refresh failed:', error);
        // 认证失败时完全重置实例
        this.destroy();
        this.init(); // 尝试重新初始化
        throw new Error('认证失败，正在尝试重新初始化');
      }
    }

    handleBeforeCreateCustomTemplate(data) {
      const { file, totalPptCount } = data
      // 是否允许用户继续制作PPT
      console.log('用户自定义完整模版，PPT文件：', file.name)
      if (totalPptCount < 2) {
        console.log('用户生成积分不足，不允许制作自定义完整模版')
        return false
      }
      return true
    }

    handleBeforeDownload(data) {
      // 自定义下载PPT的文件名称
      const { id, subject } = data
      return `PPT_${subject}.pptx`
    }

    handleError(data) {
      if (data.code === 88) {
        alert('生成次数已用完，请联系管理员');
      } else if (data.code === 401) {
        // 认证失败时的处理
        this.destroy(); // 清理当前实例
        alert('认证失败，请刷新页面重新登录');
        // 可以选择重定向到登录页面
        // window.location.reload();
      } else {
        alert('发生错误：' + (data.message || '未知错误'));
      }
    }

    // 公开方法，用于页面导航
    navigate(page) {
      this.docmeeUI.navigate({ page })
    }

    // 其他可能需要的方法
    changeCreatorData(data, createNow = false) {
      this.docmeeUI.changeCreatorData(data, createNow)
    }

    showTemplateDialog(type = 'custom') {
      this.docmeeUI.showTemplateDialog(type)
    }

    getCurrentPptInfo() {
      this.docmeeUI.getCurrentPptInfo()
    }

    // 在销毁实例时清理定时器
    destroy() {
      if (this.checkInterval) {
        clearInterval(this.checkInterval)
        this.checkInterval = null
      }
      if (this.docmeeUI) {
        try {
          this.docmeeUI.destroy()
        } catch (e) {
          console.warn('Failed to destroy UI instance:', e)
        }
        this.docmeeUI = null
      }
      // 重置所有状态
      this.isRefreshing = false
      this.refreshAttempts = 0
    }
  }

  // 初始化
  const pptGenerator = new PPTGenerator()

  // 页面导航
  function toPage(page) {
    pptGenerator.navigate(page)
    pageChange(page)
  }

  function pageChange(page) {
    const element = document.getElementById('page_' + page)
    if (element) {
      element.parentNode.childNodes.forEach(c =>
        c.classList && c.classList.remove('selected'))
      element.classList.add('selected')
    }
  }

  // 暴露一些方法到全局，方便调试和扩展
  window.pptGenerator = pptGenerator
</script>

</html>
